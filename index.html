<!DOCTYPE html>
<!-- GeoIntel Reader v2.3.4 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>GeoIntel Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-page: #ffffff;
  --bg-panel: #ffffff;
  --bg-well: #fafaf7;
  --text-1: #0f0f0f;
  --text-2: #3a3a38;
  --text-3: #6a6864;
  --text-4: #9e9b94;
  --teal: #0d7a6e;
  --teal-bg: #e0f2ef;
  --amber: #a8570f;
  --amber-bg: #faefe0;
  --violet: #5b21b6;
  --violet-bg: #eee7fb;
  --sage: #15803d;
  --coral: #b8203a;
  --gold: #8b5a00;
  --gold-bg: #f7eacb;
  --bubble-user: #1e3a8a;
  --bubble-user-text: #ffffff;
  --line-hair: 1px solid #c4bfb1;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  width: 100%;
  overflow: hidden;
  background: #ffffff;
  color: var(--text-1);
  font-family: 'Inter', -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
.app { display: flex; flex-direction: column; height: 100%; width: 100%; background: #ffffff; }
.topbar {
  flex: 0 0 56px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  background: #ffffff;
  border-bottom: var(--line-hair);
  z-index: 10;
  gap: 14px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 18px;
  letter-spacing: -0.01em;
  color: var(--text-1);
  text-decoration: none;
}
.brand-mark {
  width: 28px; height: 28px;
  border-radius: 7px;
  background: linear-gradient(135deg, var(--teal) 0%, var(--violet) 100%);
  display: grid; place-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 14px;
  color: #fff;
}
.brand em { font-style: normal; color: var(--gold); font-weight: 400; }
.brand .version {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-3);
  margin-left: 6px;
  font-weight: 400;
}
#topbar-left-extra { display: flex; align-items: center; }
.back-to-atlas {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-2);
  text-decoration: none;
  padding: 5px 10px;
  border: 1px solid #c4bfb1;
  border-radius: 6px;
  transition: all 0.15s ease;
}
.back-to-atlas:hover { background: #fafaf7; border-color: var(--text-1); color: var(--text-1); }
.topbar-center {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 13px;
  color: var(--text-2);
  min-width: 0;
}
.breadcrumb-item { display: flex; align-items: center; gap: 6px; color: var(--text-2); text-decoration: none; }
.breadcrumb-link:hover { color: var(--text-1); text-decoration: underline; }
.breadcrumb-item .dot, .topbar-center > .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-4); }
.dossier-pill {
  padding: 4px 11px;
  background: #ffffff;
  border: 1px solid #0f0f0f;
  border-radius: 100px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-1);
  letter-spacing: 0.04em;
  font-weight: 600;
}
.topbar-right { display: flex; gap: 6px; align-items: center; }
.icon-btn {
  width: 32px; height: 32px;
  border-radius: 7px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-2);
  cursor: pointer;
  display: grid; place-items: center;
  transition: all 0.15s ease;
}
.icon-btn:hover { background: var(--bg-well); border-color: var(--text-1); color: var(--text-1); }
#app-root { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: #ffffff; }

/* === Atlas SVG — shared === */
.atlas-svg { width: 100%; height: 100%; display: block; background: transparent; }
.atlas-bg { fill: #f4eee0; }
.atlas-graticule { fill: none; stroke: #d9d4c2; stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.6; }
.land polygon { fill: #d8cfb6; stroke: #6a6358; stroke-width: 0.7; stroke-linejoin: round; stroke-linecap: round; paint-order: fill stroke; transition: fill 0.2s ease; }
.cluster-marker { transition: transform 0.2s ease; }
.cluster-marker.has-data { color: var(--teal); }
.cluster-marker.empty { color: #b8b3a4; }
.cluster-marker.interactive { cursor: pointer; }
.cluster-dot { fill: currentColor; transition: r 0.2s ease, fill 0.2s ease; }
.cluster-marker.interactive.has-data:hover .cluster-dot { r: 17; }
.cluster-marker.interactive.has-data:hover .cluster-ring { opacity: 0.8; }
.cluster-marker.interactive.empty:hover .cluster-dot { r: 11; }
.cluster-count { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #ffffff; pointer-events: none; }
.cluster-label { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.005em; fill: var(--text-1); pointer-events: none; }
.cluster-marker.empty .cluster-label { fill: var(--text-3); }
.orbital-item { color: var(--violet); }
.orbital-item.interactive { cursor: pointer; }
.orbital-dot { fill: currentColor; transition: r 0.2s ease; }
.orbital-item.interactive:hover .orbital-dot { r: 13; }
.orbital-label { font-family: 'Fraunces', serif; font-weight: 500; fill: var(--text-1); pointer-events: none; }
.dossier-marker { cursor: pointer; color: var(--gold); }
.dossier-halo { fill: var(--gold); opacity: 0.25; }
.dossier-dot { fill: var(--gold); stroke: #ffffff; stroke-width: 1.5; transition: r 0.2s ease; }
.dossier-marker:hover .dossier-dot { r: 7; }
.dossier-label { font-family: 'Fraunces', serif; font-weight: 500; fill: var(--text-1); pointer-events: none; }
.legend-group { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* === Atlas ambient (right-area background when no report) === */
.atlas-ambient { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden; }
.ambient-header { flex: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; padding: 22px 32px 14px; border-bottom: var(--line-hair); gap: 16px; }
.ambient-head-text { flex: 1 1 auto; min-width: 0; }
.ambient-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 26px; letter-spacing: -0.02em; color: var(--text-1); margin-bottom: 3px; }
.ambient-subtitle { font-family: 'Fraunces', serif; font-size: 14px; font-style: italic; font-weight: 300; color: var(--text-3); }
.ambient-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--text-3); letter-spacing: 0.04em; text-transform: uppercase; }
.ambient-back { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: #ffffff; border: 1px solid #0f0f0f; border-radius: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-1); cursor: pointer; transition: all 0.15s ease; flex: 0 0 auto; }
.ambient-back:hover { background: var(--text-1); color: #ffffff; }
.atlas-ambient-map { flex: 1 1 auto; min-height: 0; position: relative; padding: 16px 28px; }
.atlas-svg { transition: opacity 0.2s ease; }
.ambient-legend { flex: 0 0 auto; display: flex; gap: 20px; padding: 10px 32px 14px; border-top: var(--line-hair); font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-3); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

/* Cluster marker states */
.cluster-marker.hidden { opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
.cluster-marker.shake .cluster-ring { animation: clusterRingPulse 0.4s ease; }
@keyframes clusterRingPulse { 0%, 100% { r: 26; opacity: 0.25; } 50% { r: 34; opacity: 0.6; stroke: #b8203a; } }

/* === Info card (overlay on atlas ambient map) === */
.atlas-ambient-map { position: relative; }
.info-card { position: absolute; top: 24px; right: 24px; width: 340px; max-height: calc(100% - 48px); padding: 22px 22px 18px; background: #ffffff; border: 1px solid #0f0f0f; border-radius: 12px; box-shadow: 0 10px 32px rgba(0,0,0,0.12); overflow-y: auto; z-index: 20; animation: infoFade 0.2s ease; }
@keyframes infoFade { from { transform: translateY(-4px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.info-card-close { position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border: 1px solid #d9d6ce; background: #ffffff; border-radius: 6px; font-size: 18px; line-height: 1; color: var(--text-2); cursor: pointer; display: grid; place-items: center; transition: all 0.15s ease; }
.info-card-close:hover { background: var(--text-1); color: #ffffff; border-color: var(--text-1); }
.info-card-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); margin-bottom: 6px; }
.info-card-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px; letter-spacing: -0.02em; color: var(--text-1); margin-bottom: 10px; line-height: 1.2; padding-right: 28px; }
.info-card-desc { font-family: 'Fraunces', serif; font-size: 14px; line-height: 1.5; color: var(--text-2); margin-bottom: 14px; }
.info-card-section-label { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
.actor-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.actor-chip { display: inline-flex; align-items: center; padding: 3px 9px; background: var(--teal-bg); color: var(--teal); border: 1px solid rgba(13,122,110,0.25); border-radius: 5px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
.info-card-foot { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-3); padding-top: 10px; border-top: 1px solid #efece4; letter-spacing: 0.02em; }

/* === New-chat button === */
.chat-header-right { display: flex; align-items: center; gap: 10px; }
.new-chat-btn { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; background: #ffffff; border: 1px solid #c4bfb1; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-1); cursor: pointer; transition: all 0.15s ease; }
.new-chat-btn:hover { background: var(--text-1); color: #ffffff; border-color: var(--text-1); }
.new-chat-btn svg { color: inherit; }
.working-surface { flex: 1 1 auto; min-height: 0; display: flex; background: #ffffff; }
.chat-panel { flex: 0 0 340px; display: flex; flex-direction: column; background: #ffffff; border-right: var(--line-hair); overflow: hidden; min-height: 0; }
.panel-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 11px 16px; background: #ffffff; border-bottom: var(--line-hair); }
.panel-title { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; letter-spacing: -0.01em; color: var(--text-1); }
.panel-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-3); letter-spacing: 0.04em; }
.panel-action { font-family: 'Inter', sans-serif; font-size: 11px; color: var(--teal); cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; text-decoration: none; }
.panel-action:hover { text-decoration: underline; }
.report-num { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--gold); font-weight: 600; letter-spacing: 0.02em; margin-left: 2px; }
.report-header-right { display: flex; align-items: center; gap: 14px; }
.download-btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; background: #ffffff; border: 1px solid #c4bfb1; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-1); cursor: pointer; transition: all 0.15s ease; }
.download-btn:hover { background: #fafaf7; border-color: var(--text-1); transform: translateY(-1px); }
.download-btn svg { color: var(--text-2); }
.chat-messages { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 14px 12px; display: flex; flex-direction: column; gap: 14px; background: #ffffff; }
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-thumb { background: #e0ddd2; border-radius: 3px; }
.day-sep { display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-4); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
.day-sep::before, .day-sep::after { content: ''; flex: 1; height: 1px; background: #d9d6ce; }
.msg { display: flex; flex-direction: column; max-width: 85%; animation: slideIn 0.3s ease; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.ai { align-self: flex-start; align-items: flex-start; }
.msg-bubble { padding: 10px 14px; font-size: 13.5px; line-height: 1.5; word-wrap: break-word; max-width: 100%; }
.msg.user .msg-bubble { background: #1e3a8a; color: #ffffff; border-radius: 14px 14px 4px 14px; }
.msg.ai .msg-bubble { background: #ffffff; color: var(--text-1); border: 1px solid #0f0f0f; border-radius: 14px 14px 14px 4px; }
.msg-bubble strong { font-weight: 600; }
.msg.user .msg-bubble strong { color: #ffffff; }
.msg.ai .msg-bubble strong { color: var(--teal); }
.msg-time { margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--text-4); letter-spacing: 0.04em; padding: 0 4px; }
.msg-link { margin-top: 7px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--teal-bg); border: 1px solid rgba(13,122,110,0.3); border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--teal); cursor: pointer; text-decoration: none; font-weight: 600; align-self: flex-start; transition: all 0.15s ease; }
.msg-link:hover { background: #d2e9e4; transform: translateY(-1px); }
.msg.pending .msg-bubble { color: var(--text-3); font-style: italic; }
.msg.pending .dots::after { content: ''; animation: dots 1.4s infinite; }
.chat-input-wrap { flex: 0 0 auto; padding: 12px 14px 14px; background: #ffffff; border-top: var(--line-hair); }
.chat-input-box { background: #ffffff; border: 1px solid #0f0f0f; border-radius: 12px; padding: 9px 12px; transition: all 0.15s ease; }
.chat-input-box:focus-within { box-shadow: 0 0 0 3px rgba(13,122,110,0.12); border-color: var(--teal); }
.chat-input-box textarea { width: 100%; background: transparent; border: none; outline: none; color: var(--text-1); font-family: inherit; font-size: 13.5px; line-height: 1.5; resize: none; min-height: 40px; max-height: 120px; }
.chat-input-box textarea::placeholder { color: var(--text-4); }
.chat-input-actions { display: flex; justify-content: flex-end; margin-top: 4px; }
.send-btn { padding: 6px 14px; background: var(--teal); color: #ffffff; border: none; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.15s ease; }
.send-btn:hover { transform: translateY(-1px); background: #0a6158; }
.send-btn[disabled], .send-btn:disabled { background: #9e9b94; cursor: not-allowed; transform: none; opacity: 0.7; }
.chat-input-box textarea[disabled], .chat-input-box textarea:disabled { color: var(--text-3); cursor: not-allowed; }
.chat-loading { display: flex; align-items: center; justify-content: center; padding: 8px 10px; margin-bottom: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: var(--text-3); background: var(--bg-well); border: 1px solid #d9d6ce; border-radius: 8px; }
.chat-error { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 12px; line-height: 1.4; color: var(--coral); background: #fdecef; border: 1px solid rgba(184,32,58,0.35); border-radius: 8px; }
.chat-error .chat-error-text { flex: 1 1 auto; min-width: 0; }
.chat-error-dismiss { flex: 0 0 auto; width: 20px; height: 20px; border: none; background: transparent; color: var(--coral); font-size: 16px; line-height: 1; cursor: pointer; border-radius: 4px; display: grid; place-items: center; transition: background 0.15s ease; }
.chat-error-dismiss:hover { background: rgba(184,32,58,0.15); }

/* v2.3.2: on-screen debug log (needed for iPad where DevTools is off). */
.debug-panel { margin-bottom: 8px; background: #fbfaf4; border: 1px solid #d9d6ce; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-2); max-height: 220px; overflow-y: auto; }
.debug-panel summary { padding: 6px 10px; cursor: pointer; user-select: none; font-weight: 700; color: var(--text-3); display: flex; align-items: center; justify-content: space-between; gap: 8px; letter-spacing: 0.04em; text-transform: uppercase; list-style: none; }
.debug-panel summary::-webkit-details-marker { display: none; }
.debug-panel summary::before { content: "▸ "; color: var(--text-4); margin-right: 4px; }
.debug-panel[open] summary::before { content: "▾ "; }
.debug-actions { display: inline-flex; gap: 6px; align-items: center; }
.debug-clear { border: 1px solid #d9d6ce; background: #ffffff; color: var(--text-3); font-family: inherit; font-size: 9.5px; padding: 2px 8px; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.08em; min-width: 48px; }
.debug-clear:hover { background: var(--text-1); color: #ffffff; border-color: var(--text-1); }
.debug-body { padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid #efece4; }
.debug-row { display: grid; grid-template-columns: 60px 170px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px dashed #efece4; word-break: break-all; }
.debug-row:last-child { border-bottom: none; }
.debug-ts { color: var(--text-4); }
.debug-label { color: var(--teal); font-weight: 700; }
.debug-text { color: var(--text-1); }

/* === v2.0: scenario report, dynamic KG graph, empty state === */
.msg-type-tag { margin-top: 3px; font-family: 'JetBrains Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-4); }
.scenario-title-inline { font-family: 'Fraunces', serif; font-weight: 500; font-size: 15px; color: var(--gold); letter-spacing: -0.01em; }
.report-empty { flex: 1 1 auto; display: grid; place-items: center; padding: 48px 32px; }
.report-empty-inner { max-width: 520px; text-align: center; }
.report-empty-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 20px; color: var(--text-2); margin-bottom: 8px; letter-spacing: -0.01em; }
.report-empty-body { font-family: 'Fraunces', serif; font-size: 14px; font-style: italic; color: var(--text-3); line-height: 1.5; }
.report-empty-title .dots::after { content: ''; animation: dots 1.4s infinite; }
.scenario-report { max-width: 820px; margin: 0 auto; padding: 36px 48px 64px; font-family: 'Fraunces', serif; color: var(--text-1); }
.scenario-report h1, .scenario-report h2 { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.02em; color: var(--text-1); }
.scenario-report h1 { font-size: 32px; line-height: 1.15; margin-bottom: 10px; }
.scenario-report h2 { font-size: 22px; margin: 26px 0 10px; }
.scenario-report h3 { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--teal); margin: 22px 0 8px; }
.scenario-report p { font-size: 15px; line-height: 1.7; color: var(--text-2); margin-bottom: 12px; }
.scenario-report ul, .scenario-report ol { margin: 0 0 14px 20px; color: var(--text-2); }
.scenario-report li { font-size: 14.5px; line-height: 1.6; margin-bottom: 6px; }
.scenario-report strong { color: var(--text-1); font-weight: 600; }
.scenario-report em { font-style: italic; color: var(--gold); }
.scenario-report .scenario-meta { display: flex; justify-content: space-between; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #d9d6ce; flex-wrap: wrap; }
.scenario-report .scenario-label { font-weight: 700; color: var(--gold); }
.scenario-report .scenario-subtitle { font-family: 'Fraunces', serif; font-style: italic; font-size: 16px; color: var(--text-3); margin: 10px 0 22px; line-height: 1.45; }
.scenario-report .arc-ref { font-family: 'JetBrains Mono', monospace; font-size: 0.88em; background: rgba(13,122,110,0.08); color: var(--teal); padding: 0.05em 0.35em; border-radius: 3px; border: 1px solid rgba(13,122,110,0.18); }
.scenario-report blockquote { position: relative; margin: 20px 0; padding: 14px 20px; font-style: italic; color: var(--text-2); border-left: 3px solid var(--gold); background: linear-gradient(90deg, var(--gold-bg) 0%, transparent 60%); border-radius: 0 6px 6px 0; font-size: 15.5px; line-height: 1.55; }

/* v2.2 Section 1: headline block (Likelihood + Evidence strength). */
.scenario-report .scenario-headline { display: flex; gap: 2rem; padding: 0.75rem 0; margin: 0.5rem 0 1.25rem 0; border-top: 1px solid #d9d6ce; border-bottom: 1px solid #d9d6ce; flex-wrap: wrap; }
.scenario-report .headline-item { display: flex; flex-direction: column; gap: 0.2rem; }
.scenario-report .headline-label { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); font-weight: 700; }
.scenario-report .headline-value { font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 600; color: var(--teal); letter-spacing: -0.005em; }
.scenario-report .headline-range { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 400; color: var(--text-3); margin-left: 0.35rem; }

/* v2.3 Section 1: user question blockquote inside the Report. */
.scenario-report .scenario-question { margin: 1rem 0 1.25rem 0; padding: 10px 16px; border-left: 3px solid var(--teal); background: rgba(13,122,110,0.04); font-family: 'Fraunces', serif; font-style: italic; color: var(--text-1); font-size: 15px; line-height: 1.55; border-radius: 0 6px 6px 0; }
.scenario-report .scenario-question .question-label { display: block; font-family: 'JetBrains Mono', monospace; font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); margin-bottom: 6px; }

/* v2.2 Section 2.2: clickable scenario-recall cards in the chat flow. */
.scenario-card { align-self: flex-start; max-width: 92%; margin: 2px 0; padding: 10px 14px; border: 1px solid var(--teal); border-radius: 10px; background: rgba(13,122,110,0.04); cursor: pointer; transition: background 0.12s ease, transform 0.12s ease; animation: slideIn 0.3s ease; outline: none; }
.scenario-card:hover { background: rgba(13,122,110,0.09); transform: translateX(1px); }
.scenario-card:focus-visible { box-shadow: 0 0 0 3px rgba(13,122,110,0.25); }
.scenario-card.active { background: rgba(13,122,110,0.14); border-width: 2px; padding: 9px 13px; }
.scenario-card-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--teal); text-transform: uppercase; margin-bottom: 4px; }
.scenario-card-title { font-family: 'Fraunces', serif; font-size: 14px; font-weight: 500; color: var(--text-1); line-height: 1.3; margin-bottom: 3px; letter-spacing: -0.01em; }
.scenario-card-hint { font-family: 'Fraunces', serif; font-size: 11.5px; font-style: italic; color: var(--text-3); }

/* v2.2 Section 4: PDF export layout classes. */
.pdf-page-break { page-break-after: always; break-after: page; height: 0; }
.pdf-section { page-break-inside: avoid; }
.pdf-section-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 20px; margin: 0 0 4px 0; color: var(--text-1); letter-spacing: -0.015em; }
.pdf-section-sub { font-family: 'Fraunces', serif; font-style: italic; font-size: 12px; color: var(--text-3); margin: 0 0 14px 0; }

/* KG dynamic graph styling (replaces the old per-dossier graph_svg). */
.kg-graph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.kg-arc { transition: stroke-opacity 0.2s ease, stroke-width 0.2s ease; }
.kg-node { cursor: default; transition: opacity 0.2s ease; }
.kg-node > circle { transition: r 0.15s ease, stroke-width 0.15s ease; }
.kg-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: var(--text-2); pointer-events: none; font-weight: 600; letter-spacing: 0.02em; }

/* Active-subgraph isolation (v2.2 Section 3): fully HIDE non-highlighted
   nodes/arcs instead of dimming. `display:none` on the <g> node group also
   hides the child label, so orphan labels cannot float. */
.graph-panel.active-subgraph .kg-node:not(.highlighted),
.graph-panel.active-subgraph .kg-arc:not(.highlighted),
.graph-overlay-box.active-subgraph .kg-node:not(.highlighted),
.graph-overlay-box.active-subgraph .kg-arc:not(.highlighted),
.graph-overlay-canvas.active-subgraph .kg-node:not(.highlighted),
.graph-overlay-canvas.active-subgraph .kg-arc:not(.highlighted) {
  display: none;
}
.graph-panel.active-subgraph .kg-node.highlighted > circle { r: 10; stroke-width: 2.5; filter: drop-shadow(0 0 4px rgba(184,32,58,0.45)); }
.graph-panel.active-subgraph .kg-arc.highlighted { stroke-opacity: 1; filter: drop-shadow(0 0 3px rgba(184,32,58,0.3)); }
.graph-panel.active-subgraph .kg-node.highlighted .kg-label,
.graph-overlay-box.active-subgraph .kg-node.highlighted .kg-label {
  display: block;
  fill: var(--text-1);
  font-weight: 700;
}

.right-area { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

.graph-svg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; display: block; }
.legend { flex: 0 0 auto; display: flex; gap: 14px; padding: 8px 16px 10px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 10px; border-top: 1px solid #efece4; background: #ffffff; }

.timeline { position: relative; padding-left: 14px; }

.report { max-width: 820px; margin: 0 auto; padding: 36px 48px 64px; }
.report-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 38px; line-height: 1.1; letter-spacing: -0.025em; color: var(--text-1); margin-bottom: 10px; }

.byline { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid #0f0f0f; border-bottom: 1px solid #0f0f0f; margin-bottom: 26px; font-size: 11.5px; color: var(--text-3); font-family: 'JetBrains Mono', monospace; flex-wrap: wrap; }
.byline-item { display: flex; align-items: center; gap: 6px; }
.byline-item .label { color: var(--text-4); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
.byline-item .value { color: var(--text-1); font-weight: 600; }
.byline-item .value.teal { color: var(--teal); }
.exec-summary { position: relative; padding: 22px 26px 22px 32px; background: #ffffff; border: 1px solid #0f0f0f; border-radius: 10px; margin-bottom: 32px; }
.exec-summary::before { content: ''; position: absolute; left: 0; top: 22px; bottom: 22px; width: 3px; background: linear-gradient(180deg, var(--teal) 0%, var(--violet) 100%); border-radius: 0 2px 2px 0; }
.exec-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal); margin-bottom: 10px; font-weight: 700; }
.exec-text { font-family: 'Fraunces', serif; font-size: 16.5px; line-height: 1.55; color: var(--text-1); }

.report-body h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; letter-spacing: -0.015em; margin: 38px 0 14px; color: var(--text-1); display: flex; align-items: baseline; gap: 12px; }
.report-body h2::before { content: attr(data-num); font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: 0.05em; }
.report-body h3 { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-2); margin: 22px 0 10px; }
.report-body p { font-size: 15px; line-height: 1.7; color: var(--text-2); margin-bottom: 14px; }
.report-body p strong { color: var(--text-1); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; border: 1px solid transparent; vertical-align: baseline; }
.chip::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
.chip.actor { color: var(--teal); background: var(--teal-bg); border-color: rgba(13,122,110,0.25); }
.chip.actor::before { background: var(--teal); }
.chip.asset { color: var(--amber); background: var(--amber-bg); border-color: rgba(168,87,15,0.25); }
.chip.asset::before { background: var(--amber); }

.report-list { list-style: none; margin: 12px 0 16px; padding-left: 0; }

.report-list li:last-child { border-bottom: none; }

blockquote.pullquote { position: relative; margin: 26px 0; padding: 20px 28px 20px 32px; font-family: 'Fraunces', serif; font-style: italic; font-size: 18px; line-height: 1.5; color: var(--text-1); border-left: 3px solid var(--gold); background: linear-gradient(90deg, var(--gold-bg) 0%, transparent 60%); border-radius: 0 8px 8px 0; }
blockquote.pullquote::before { content: '\201C'; position: absolute; left: 12px; top: -4px; font-family: 'Fraunces', serif; font-size: 48px; color: var(--gold); opacity: 0.5; line-height: 1; }
blockquote.pullquote cite { display: block; margin-top: 10px; font-style: normal; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); letter-spacing: 0.05em; text-transform: uppercase; font-weight: 600; }
blockquote.pullquote cite::before { content: '\2014 '; color: var(--text-4); }
.data-callout { display: grid; grid-template-columns: repeat(3, 1fr); margin: 24px 0; border: 1px solid #0f0f0f; border-radius: 10px; overflow: hidden; background: #ffffff; }

.data-callout-cell .dc-value { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 500; color: var(--text-1); letter-spacing: -0.02em; line-height: 1; margin-bottom: 3px; }

.data-callout-cell .dc-value.sage { color: var(--sage); }
.data-callout-cell .dc-hint { font-size: 11px; color: var(--text-3); }
.sources { margin-top: 44px; padding-top: 20px; border-top: 1px solid #0f0f0f; }
.sources-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); margin-bottom: 12px; font-weight: 700; }
.source-item { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; padding: 11px 0; border-bottom: 1px dashed #d9d6ce; align-items: center; font-size: 12.5px; }
.source-item:last-child { border-bottom: none; }
.source-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--gold); font-weight: 700; }
.source-title { color: var(--text-1); font-weight: 600; }
.source-meta { color: var(--text-3); font-size: 11px; margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
.source-date { color: var(--text-3); font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; }
@keyframes slideIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
.graph-node { cursor: pointer; transition: opacity 0.2s ease; }
.graph-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: var(--text-2); pointer-events: none; letter-spacing: 0.04em; font-weight: 600; }

/* Graph filters — the parent .graph-panel carries data-graph-filter. */
.graph-panel[data-graph-filter="actor"] .graph-node:not([data-type="actor"]) { opacity: 0.12; }
.graph-panel[data-graph-filter="asset"] .graph-node:not([data-type="asset"]) { opacity: 0.12; }
.graph-panel[data-graph-filter="event"] .graph-node:not([data-type="event"]) { opacity: 0.12; }
.graph-panel[data-graph-highlight] .graph-node:not(.highlight) { opacity: 0.22; }
.graph-node.highlight { filter: drop-shadow(0 0 6px rgba(184,32,58,0.7)); }
.graph-node.highlight circle[stroke], .graph-node.highlight rect[stroke], .graph-node.highlight polygon[stroke] { stroke-width: 4; }

/* Report chip visual hint that it's clickable. */
.report-body .chip { cursor: pointer; user-select: none; }
.report-body .chip:active { transform: translateY(0); opacity: 0.85; }

/* Snapshot byline: query that triggered the report. */

.snapshot-query-label { font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; color: var(--teal); }
.snapshot-query-text { font-family: 'Fraunces', serif; font-style: italic; font-size: 14px; color: var(--text-2); font-weight: 300; }

/* Archive drawer (overlays the left side over chat panel). */
.archive-drawer { position: fixed; top: 56px; left: 0; bottom: 0; width: 320px; background: #ffffff; border-right: 1px solid #0f0f0f; box-shadow: 4px 0 20px rgba(0,0,0,0.08); z-index: 40; display: flex; flex-direction: column; animation: archiveSlide 0.22s ease; }
@keyframes archiveSlide { from { transform: translateX(-6px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.archive-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: var(--line-hair); }
.archive-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 18px; letter-spacing: -0.01em; color: var(--text-1); }
.archive-close { width: 26px; height: 26px; border: 1px solid #d9d6ce; background: #ffffff; border-radius: 6px; font-size: 18px; line-height: 1; color: var(--text-2); cursor: pointer; display: grid; place-items: center; transition: all 0.15s ease; }
.archive-close:hover { background: var(--text-1); color: #ffffff; border-color: var(--text-1); }
.archive-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 10px; }
.archive-body::-webkit-scrollbar { width: 6px; }
.archive-body::-webkit-scrollbar-thumb { background: #e0ddd2; border-radius: 3px; }
.archive-item { display: flex; align-items: stretch; gap: 6px; padding: 0; margin-bottom: 4px; border-radius: 8px; border: 1px solid transparent; transition: all 0.12s ease; }
.archive-item:hover { border-color: #0f0f0f; background: #fafaf7; }
.archive-item-main { flex: 1 1 auto; min-width: 0; padding: 10px 12px; cursor: pointer; }
.archive-item-title { font-family: 'Fraunces', serif; font-size: 14px; font-weight: 500; color: var(--text-1); margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
.archive-item-meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-3); letter-spacing: 0.03em; }
.archive-delete { flex: 0 0 auto; width: 26px; margin: 8px 8px 8px 0; border: 1px solid transparent; background: transparent; border-radius: 6px; color: var(--text-4); font-size: 16px; line-height: 1; cursor: pointer; transition: all 0.12s ease; }
.archive-delete:hover { color: var(--coral); border-color: var(--coral); }
.archive-empty { padding: 30px 20px; font-family: 'Fraunces', serif; font-style: italic; color: var(--text-3); font-size: 14px; text-align: center; }
.archive-footer { flex: 0 0 auto; padding: 10px 16px; border-top: var(--line-hair); }
.archive-clear-all { width: 100%; padding: 7px 12px; background: #ffffff; border: 1px solid #d9d6ce; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); cursor: pointer; transition: all 0.15s ease; }
.archive-clear-all:hover { background: var(--coral); color: #ffffff; border-color: var(--coral); }

/* Make panel-action work as a button too. */
.panel-action-btn { background: transparent; border: none; padding: 0; font: inherit; }
.panel-action-btn:hover { text-decoration: underline; }

/* Keyboard focus — consistent ring across interactive elements. */
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.msg-link:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* === Graph fullscreen overlay === */
.graph-overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: stretch; justify-content: center; animation: overlayFade 0.18s ease; }
@keyframes overlayFade { from { opacity: 0; } to { opacity: 1; } }
.graph-overlay-bg { position: absolute; inset: 0; background: rgba(15,15,15,0.55); cursor: zoom-out; }
.graph-overlay-box { position: relative; margin: 40px; flex: 1 1 auto; background: #ffffff; border: 1px solid #0f0f0f; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.25); display: flex; flex-direction: column; overflow: hidden; }
.graph-overlay-header { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: var(--line-hair); }
.graph-overlay-title { font-family: 'Fraunces', serif; font-weight: 500; font-size: 20px; letter-spacing: -0.015em; color: var(--text-1); }
.graph-overlay-close { width: 32px; height: 32px; border: 1px solid #d9d6ce; background: #ffffff; border-radius: 7px; font-size: 22px; line-height: 1; color: var(--text-2); cursor: pointer; display: grid; place-items: center; transition: all 0.15s ease; }
.graph-overlay-close:hover { background: var(--text-1); color: #ffffff; border-color: var(--text-1); }
.graph-overlay-canvas { flex: 1 1 auto; min-height: 0; position: relative; background: #fafaf7; }
.graph-overlay-canvas .graph-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.graph-overlay-hint { flex: 0 0 auto; padding: 8px 20px 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-4); letter-spacing: 0.08em; text-transform: uppercase; text-align: right; font-weight: 600; }

/* === Print / PDF export === */
@media print {
  @page { size: A4; margin: 18mm 14mm; }
  html, body { height: auto !important; overflow: visible !important; background: #ffffff !important; }
  .topbar, .chat-panel, .upper-strip, .graph-overlay, .archive-drawer, .info-card, .atlas-ambient, .ambient-header, .ambient-legend, .panel-header, .download-btn, .report-header-right { display: none !important; }
  .app, #app-root, .working-surface, .right-area, .report-panel, .report-scroll { display: block !important; height: auto !important; overflow: visible !important; flex: none !important; }
  .report-scroll { overflow: visible !important; }
  .report { max-width: none !important; padding: 0 !important; margin: 0 !important; }
  .report-body p, .report-body li { color: #111 !important; }
  .chip { background: transparent !important; border: none !important; padding: 0 !important; color: #111 !important; font-weight: 700 !important; }
  .chip::before { display: none !important; }
  .snapshot-query { padding: 0 0 8mm 0 !important; max-width: none !important; }
  a { color: #111 !important; text-decoration: none !important; }
}
</style>
